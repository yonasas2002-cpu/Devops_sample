name: build-and-lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint backend
        working-directory: server
        run: npm run lint -- --max-warnings=0

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint -- --max-warnings=0

      - name: Build backend image
        run: docker build -t backend ./server

      - name: Build frontend image
        run: docker build -t frontend ./client

  deploy:
    needs: build-and-lint
    # deploy only when main is pushed, not dev or pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # never run two deploys at the same time
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/home/ec2-user/devops_sample' }}
        run: |
          printf '%s' "$EC2_USER" | od -An -c
          # strip hidden spaces or newlines from the secrets
          EC2_HOST=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          EC2_USER=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')

          test -n "$EC2_HOST" || { echo "EC2_HOST secret is empty"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER secret is empty"; exit 1; }
          test -n "$EC2_KEY"  || { echo "EC2_KEY secret is empty"; exit 1; }

          # trust the server's host key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "Cannot reach the EC2 host on port 22 (check EC2_HOST and the security group)"; exit 1; }

          # write the private key with safe permissions, removing Windows line endings
          install -m 600 /dev/null ~/.ssh/ec2_key.pem
          printf '%s\n' "$EC2_KEY" | tr -d '\r' > ~/.ssh/ec2_key.pem

          # check the key is valid and show its fingerprint (safe to print)
          ssh-keygen -y -f ~/.ssh/ec2_key.pem > /tmp/ec2_key.pub \
            || { echo "EC2_KEY is not a valid private key. Re-paste the whole file, including the BEGIN and END lines."; exit 1; }
          echo "Key fingerprint:"
          ssh-keygen -lf /tmp/ec2_key.pub

          ssh -i ~/.ssh/ec2_key.pem \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" << EOF
          set -e
          cd "$EC2_APP_DIR"
          git fetch --all
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
          docker compose ps
          EOF
